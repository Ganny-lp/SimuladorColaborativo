<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="__FONTS_URL__">
<script>__THEME_SYNC__</script>
<style>
__TOKENS__
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:transparent;overflow:hidden;font-family:var(--sans);color:var(--text);}
body{opacity:0;transition:opacity .2s;}
body.ready{opacity:1;}

#wrap{position:relative;height:100%;min-height:84px;padding:0 2px;}

/* balão com o preço, acompanha o botão */
#bubble{
  position:absolute;top:0;left:0;transform:translateX(-50%);
  padding:3px 11px;border-radius:999px;white-space:nowrap;
  background:var(--text);color:var(--bg);
  font-family:var(--display);font-weight:600;font-size:14px;line-height:20px;font-variant-numeric:tabular-nums;
  box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none;
}
#bubble::after{
  content:'';position:absolute;left:50%;bottom:-4px;width:8px;height:8px;
  background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:2px;
}

/* trilho: o gradiente ocupa a área útil (recuada meia largura do botão, para a cor sob o botão bater com o valor); as pontas repetem a cor extrema */
#rail{
  position:absolute;left:0;right:0;top:41px;height:10px;padding:0 12px;border-radius:6px;box-sizing:border-box;
  background-image:linear-gradient(var(--c0),var(--c0)),linear-gradient(var(--c1),var(--c1)),__GRADIENT__;
  background-repeat:no-repeat;background-origin:border-box,border-box,content-box;
  background-size:12px 100%,12px 100%,100% 100%;background-position:left top,right top,0 0;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.10);
}
.tick{position:absolute;top:13px;width:2px;height:6px;margin-left:-1px;border-radius:1px;background:var(--text3);opacity:.55;}

input[type=range]{
  -webkit-appearance:none;appearance:none;position:absolute;left:0;right:0;top:32px;width:100%;height:28px;
  background:transparent;cursor:pointer;outline:none;touch-action:none;
}
input[type=range]::-webkit-slider-runnable-track{height:28px;background:transparent;}
input[type=range]::-moz-range-track{height:28px;background:transparent;}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;box-sizing:border-box;width:24px;height:24px;margin-top:2px;border-radius:50%;
  background:var(--thumb);border:3px solid var(--thumb-ring);box-shadow:0 2px 8px rgba(0,0,0,.35);
  transition:transform .12s var(--ease),box-shadow .12s;
}
input[type=range]::-moz-range-thumb{
  box-sizing:border-box;width:24px;height:24px;border-radius:50%;background:var(--thumb);border:3px solid var(--thumb-ring);
  box-shadow:0 2px 8px rgba(0,0,0,.35);transition:transform .12s var(--ease),box-shadow .12s;
}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.12);}
input[type=range]:active::-moz-range-thumb{transform:scale(1.12);}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px color-mix(in srgb,var(--focus) 60%,transparent),0 2px 8px rgba(0,0,0,.35);}
input[type=range]:focus-visible::-moz-range-thumb{box-shadow:0 0 0 4px color-mix(in srgb,var(--focus) 60%,transparent),0 2px 8px rgba(0,0,0,.35);}

/* extremos e referência mais próxima */
#meta{position:absolute;left:2px;right:2px;top:68px;display:flex;align-items:center;gap:12px;
  font-size:12.5px;color:var(--text3);font-variant-numeric:tabular-nums;}
#meta .end{flex-shrink:0;}
#cap{flex:1;min-width:0;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2);}
#cap i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:baseline;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);}
@media (max-width:420px){#cap{display:none;} #meta{justify-content:space-between;}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div id="wrap">
  <div id="bubble" aria-hidden="true">R$ 0</div>
  <div id="rail" aria-hidden="true"></div>
  <input type="range" id="r" min="__VMIN__" max="__VMAX__" step="1" value="__VMIN__"
         aria-label="Preço de venda" aria-valuetext="R$ __VMIN_LABEL__">
  <div id="meta"><span class="end">R$ __VMIN_LABEL__</span><span id="cap"></span><span class="end">R$ __VMAX_LABEL__</span></div>
</div>
<script>
/*
 * Régua de preço. O iframe NÃO contém o valor atual: ele é lido do st.number_input oculto da
 * página pai (aria-label = KEY) e sincronizado a cada 250 ms. Assim o HTML é idêntico entre
 * execuções, o Streamlit não recria o iframe, e o foco do teclado/arraste sobrevivem ao rerun.
 * Para devolver o valor ao Python, escreve no number_input e dispara os eventos do React.
 */
(function () {
  var KEY = "__SYNC_KEY__", VMIN = __VMIN__, VMAX = __VMAX__, STOPS = __STOPS_JSON__;
  var input = document.getElementById('r'), bubble = document.getElementById('bubble');
  var cap = document.getElementById('cap'), wrap = document.getElementById('wrap'), rail = document.getElementById('rail');
  var current = VMIN, dragging = false, pointerDown = false, pending = null, ready = false;
  var BASE_PAD = 12;   // meia largura do botão (24px)

  var ordered = STOPS.slice().sort(function (a, b) { return a.v - b.v; });
  if (ordered.length) {   // cor das pontas do trilho (recuo de meio botão)
    rail.style.setProperty('--c0', ordered[0].c);
    rail.style.setProperty('--c1', ordered[ordered.length - 1].c);
  }
  ordered.forEach(function (s) {
    var t = document.createElement('i'); t.className = 'tick';
    t.style.left = 'calc(12px + (100% - 24px) * ' + ((s.v - VMIN) / ((VMAX - VMIN) || 1)) + ')';
    t.title = 'R$ ' + fmt(s.v) + ' · ' + s.l;
    rail.appendChild(t);
  });

  function fmt(v) { return Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 0 }); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function paint(v) {
    var frac = clamp((v - VMIN) / ((VMAX - VMIN) || 1), 0, 1);
    var w = wrap.clientWidth, usable = w - 2 * BASE_PAD;
    var x = BASE_PAD + usable * frac, half = bubble.offsetWidth / 2 + 2;
    bubble.style.left = clamp(x, half, w - half) + 'px';
    bubble.textContent = 'R$ ' + fmt(v);
    input.setAttribute('aria-valuetext', 'R$ ' + fmt(v));
    var best = null;
    ordered.forEach(function (s) { if (!best || Math.abs(s.v - v) < Math.abs(best.v - v)) best = s; });
    cap.textContent = '';
    if (best) {
      var dot = document.createElement('i'); dot.style.background = best.c;
      cap.appendChild(dot);
      cap.appendChild(document.createTextNode(best.l + ' · R$ ' + fmt(best.v)));
      cap.title = cap.textContent;
    }
  }
  function setValue(v) { current = v; input.value = v; paint(v); }

  function parentInput() {
    try { return window.parent.document.querySelector('input[aria-label="' + KEY + '"]'); }
    catch (e) { return null; }
  }
  function push(v) {
    pending = null;
    var el = parentInput();
    if (!el) { console.warn('LUMINA: input de sincronização não encontrado.'); return; }
    try {
      var setter = Object.getOwnPropertyDescriptor(window.parent.HTMLInputElement.prototype, 'value').set;
      el.focus();
      setter.call(el, String(v));
      el.dispatchEvent(new Event('input', { bubbles: true }));
      el.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
      el.blur();
    } catch (err) { console.error('LUMINA: falha ao sincronizar preço:', err); }
    if (!pointerDown) input.focus({ preventScroll: true });   // o blur do input pai tirou o foco: devolve à régua
  }

  input.addEventListener('pointerdown', function () { pointerDown = true; });
  window.addEventListener('pointerup', function () { pointerDown = false; });
  input.addEventListener('input', function () {
    dragging = true; current = parseFloat(input.value); paint(current);
  });
  input.addEventListener('change', function () {
    dragging = false;
    var v = parseFloat(input.value);
    clearTimeout(pending);
    // mouse/toque: envia ao soltar. Teclado: junta várias setas num único envio.
    pending = setTimeout(function () { push(v); }, pointerDown ? 0 : 300);
  });

  // parent → iframe: reflete mudanças externas (Reiniciar, valor inicial)
  function poll() {
    if (!ready) { /* aguarda o primeiro valor, mas não deixa a régua invisível para sempre */ }
    var el = parentInput();
    if (el && el.value !== '' && !dragging && pending === null) {
      var v = parseFloat(el.value);
      if (isFinite(v) && v !== current) setValue(clamp(v, VMIN, VMAX));
      if (!ready) { ready = true; document.body.classList.add('ready'); }
    }
  }
  setInterval(poll, 250); poll();
  setTimeout(function () { if (!ready) { ready = true; paint(current); document.body.classList.add('ready'); } }, 1500);

  new ResizeObserver(function () { paint(current); }).observe(wrap);
  paint(current);
})();
</script>
</body>
</html>
