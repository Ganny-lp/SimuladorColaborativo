<style>
__TOKENS__
  html, body { background: transparent !important; margin:0; font-family:var(--sans); }
  *, *::before, *::after { box-sizing:border-box; }
  .ruler { width:100%; padding:14px 6px 6px; }
  .ruler-top { display:flex; justify-content:space-between; align-items:baseline; font-family:var(--mono); font-size:12px; color:var(--text3); margin-bottom:12px; }
  .ruler-val { color:var(--text); font-weight:500; font-size:18px; }
  #__UID__ { -webkit-appearance:none; appearance:none; width:100%; height:12px; border-radius:8px; background:__GRADIENT__; outline:none; cursor:pointer; margin:0; display:block; }
  #__UID__:focus-visible { outline:2px solid var(--focus); outline-offset:4px; }
  #__UID__::-webkit-slider-runnable-track { -webkit-appearance:none; appearance:none; width:100%; height:12px; border-radius:8px; background:__GRADIENT__; }
  #__UID__::-moz-range-track { width:100%; height:12px; border-radius:8px; background:__GRADIENT__; }
  #__UID__::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:24px; height:24px; border-radius:50%; background:var(--yellow); border:3px solid var(--bg2); box-shadow:0 2px 10px rgba(0,0,0,.35); cursor:pointer; margin-top:-6px; }
  #__UID__::-moz-range-thumb { width:24px; height:24px; border-radius:50%; background:var(--yellow); border:3px solid var(--bg2); box-shadow:0 2px 10px rgba(0,0,0,.35); cursor:pointer; }
  #__UID__::-moz-focus-outer { border:0; }
</style>
<div class="ruler">
  <div class="ruler-top">
    <span>R$ __VMIN_LABEL__</span>
    <span id="__UID__-val" class="ruler-val">R$ __VALUE_LABEL__</span>
    <span>R$ __VMAX_LABEL__</span>
  </div>
  <input type="range" id="__UID__" min="__VMIN__" max="__VMAX__" step="1" value="__VALUE__" aria-label="Preço de venda">
</div>
<script>
__THEME_BRIDGE__
</script>
<script>
  /*
   * Régua de preço (puro <input type="range">). Para devolver o valor ao Python sem
   * navegar a página, escreve num st.number_input nativo e oculto (aria-label=SYNC_KEY)
   * da página pai e dispara os eventos que o React do Streamlit espera.
   */
  (function() {
    const slider = document.getElementById("__UID__");
    const label  = document.getElementById("__UID__-val");
    if (!slider) return;

    slider.addEventListener("input", function() {
      label.textContent = "R$ " + parseFloat(slider.value).toFixed(0);
    });

    slider.addEventListener("change", function() {
      const v = slider.value;
      try {
        const doc = window.parent.document;
        const input = doc.querySelector('input[aria-label="__SYNC_KEY__"]');
        if (!input) { console.warn("LUMINA: input de sincronização não encontrado."); return; }
        const setter = Object.getOwnPropertyDescriptor(window.parent.HTMLInputElement.prototype, 'value').set;
        input.focus();
        setter.call(input, v);
        input.dispatchEvent(new Event('input', { bubbles: true }));
        input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
        input.blur();
      } catch (err) {
        console.error("LUMINA: falha ao sincronizar preço:", err);
      }
    });
  })();
</script>
