<div style="width:100%;padding:8px 4px 4px;font-family:'DM Sans',sans-serif;">
  <div style="display:flex;justify-content:space-between;align-items:baseline;
              font-family:'DM Mono',monospace;font-size:12px;color:#8892be;margin-bottom:8px;">
    <span>R$ __VMIN_LABEL__</span>
    <span id="__UID__-val" style="color:#e8a94a;font-weight:600;font-size:16px;">R$ __VALUE_LABEL__</span>
    <span>R$ __VMAX_LABEL__</span>
  </div>
  <input type="range" id="__UID__" min="__VMIN__" max="__VMAX__" step="1" value="__VALUE__"
    style="
      -webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:8px;
      background:__GRADIENT__;outline:none;cursor:pointer;margin:0;display:block;
    ">
</div>
<style>
  html, body { background: transparent !important; margin:0; }
  #__UID__::-webkit-slider-runnable-track {
    -webkit-appearance:none;appearance:none;
    width:100%;height:12px;border-radius:8px;background:__GRADIENT__;
  }
  #__UID__::-moz-range-track {
    width:100%;height:12px;border-radius:8px;background:__GRADIENT__;
  }
  #__UID__::-webkit-slider-thumb {
    -webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;
    background:#ffffff;border:3px solid #13162a;box-shadow:0 2px 10px rgba(0,0,0,.6);
    cursor:pointer;margin-top:-5px;
  }
  #__UID__::-moz-range-thumb {
    width:22px;height:22px;border-radius:50%;background:#ffffff;
    border:3px solid #13162a;box-shadow:0 2px 10px rgba(0,0,0,.6);cursor:pointer;
  }
  #__UID__::-moz-focus-outer { border:0; }
</style>
<script>
  /*
   * Régua de preço (puro <input type="range">). Para devolver o valor ao Python sem
   * navegar a página, escreve num st.number_input nativo e oculto (aria-label=SYNC_KEY)
   * da página pai e dispara os eventos que o React do Streamlit espera.
   */
  (function() {
    const slider = document.getElementById("__UID__");
    const label  = document.getElementById("__UID__-val");
    if (!slider) return;

    slider.addEventListener("input", function() {
      label.textContent = "R$ " + parseFloat(slider.value).toFixed(0);
    });

    slider.addEventListener("change", function() {
      const v = slider.value;
      try {
        const doc = window.parent.document;
        const input = doc.querySelector('input[aria-label="__SYNC_KEY__"]');
        if (!input) { console.warn("LUMINA: input de sincronização não encontrado."); return; }
        const setter = Object.getOwnPropertyDescriptor(window.parent.HTMLInputElement.prototype, 'value').set;
        input.focus();
        setter.call(input, v);
        input.dispatchEvent(new Event('input', { bubbles: true }));
        input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
        input.blur();
      } catch (err) {
        console.error("LUMINA: falha ao sincronizar preço:", err);
      }
    });
  })();
</script>
