<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diagrama CLD · LUMINA</title>
<link rel="stylesheet" href="__FONTS_URL__">
<script>__THEME_SYNC__</script>
<style>
:root{--mark-dark:url("__LOGO_MARK_DARK__");--mark-light:url("__LOGO_MARK_LIGHT__");}
__STYLES__
</style>
</head>
<body>

<!-- Ícones (traço 2px, estilo Lucide). Usados com <svg class="ic"><use href="#i-nome"/></svg> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-pointer" viewBox="0 0 24 24"><path d="M4.04 4.69a.5.5 0 0 1 .65-.65l16 6.5a.5.5 0 0 1-.06.95l-6.12 1.58a2 2 0 0 0-1.44 1.43l-1.58 6.13a.5.5 0 0 1-.95.06z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><path d="M8 12h8"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M21.17 6.81a1 1 0 0 0-3.99-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"/><path d="m15 5 4 4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
  <symbol id="i-fit" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
  <symbol id="i-spread" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></symbol>
  <symbol id="i-flip" viewBox="0 0 24 24"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
</svg>

<div id="shell">

  <!-- BARRA DE FERRAMENTAS -->
  <header id="topbar" role="toolbar" aria-label="Ferramentas do diagrama">
    <div class="grp" role="group" aria-label="Modo de edição">
      <button type="button" class="tbtn active" data-tool="select" aria-pressed="true" title="Selecionar e mover (S)">
        <svg class="ic"><use href="#i-pointer"/></svg><span class="lbl">Selecionar</span></button>
      <button type="button" class="tbtn" data-tool="link" aria-pressed="false" title="Ligar duas variáveis (L)">
        <svg class="ic"><use href="#i-link"/></svg><span class="lbl">Ligar</span></button>
    </div>
    <button type="button" class="tbtn ghost" id="btn-add" title="Novo nó (N)">
      <svg class="ic"><use href="#i-plus"/></svg><span class="lbl">Novo nó</span></button>

    <div id="search" role="search">
      <svg class="ic"><use href="#i-search"/></svg>
      <input id="search-input" type="search" placeholder="Buscar variável…" aria-label="Buscar variável"
             autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="search-results">
      <kbd>/</kbd>
      <ul id="search-results" role="listbox" hidden></ul>
    </div>

    <div class="spacer"></div>

    <span id="status" data-state="idle" role="status" aria-live="polite"><i></i><span id="status-text">Sem alterações</span></span>
    <button type="button" class="tbtn primary" id="btn-save" title="Salvar o diagrama na nuvem">
      <svg class="ic"><use href="#i-save"/></svg><span class="lbl">Salvar</span></button>
    <button type="button" class="tbtn ghost" id="btn-reload" title="Descartar edições locais e recarregar da nuvem">
      <svg class="ic"><use href="#i-refresh"/></svg><span class="lbl">Recarregar</span></button>
    <button type="button" class="tbtn icon" id="btn-panel" aria-pressed="true" title="Mostrar/ocultar detalhes (P)" aria-label="Painel de detalhes">
      <svg class="ic"><use href="#i-panel"/></svg></button>
  </header>

  <div id="main">

    <!-- ÁREA DO DIAGRAMA -->
    <div id="stage">
      <div id="viewport" data-tool="select">
        <div id="world">
          <svg id="edges" aria-hidden="true">
            <defs>
              <marker id="m-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
                <path d="M1.5 1.8 8.5 5l-7 3.2z" style="fill:var(--edge)"/></marker>
              <marker id="m-pos" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
                <path d="M1.5 1.8 8.5 5l-7 3.2z" style="fill:var(--pos)"/></marker>
              <marker id="m-neg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
                <path d="M1.5 1.8 8.5 5l-7 3.2z" style="fill:var(--neg)"/></marker>
            </defs>
            <g id="edge-layer"></g>
          </svg>
          <div id="nodes"></div>
        </div>
      </div>

      <div id="hint" hidden></div>
      <div id="empty" hidden>
        <p>O diagrama está vazio.</p>
        <button type="button" class="btn primary" id="btn-empty-add">Criar o primeiro nó</button>
      </div>

      <div id="dock">
        <div id="legend" role="group" aria-label="Filtrar por categoria"></div>
        <div id="zoombar" role="group" aria-label="Zoom">
          <button type="button" class="tbtn icon" id="z-out" title="Diminuir (−)" aria-label="Diminuir zoom"><svg class="ic"><use href="#i-minus"/></svg></button>
          <output id="z-val" title="Nível de zoom">100%</output>
          <button type="button" class="tbtn icon" id="z-in" title="Aumentar (+)" aria-label="Aumentar zoom"><svg class="ic"><use href="#i-plus"/></svg></button>
          <i class="sep"></i>
          <button type="button" class="tbtn icon" id="z-fit" title="Ajustar à tela (F)" aria-label="Ajustar à tela"><svg class="ic"><use href="#i-fit"/></svg></button>
          <button type="button" class="tbtn icon" id="z-tidy" title="Afastar nós sobrepostos" aria-label="Afastar nós sobrepostos"><svg class="ic"><use href="#i-spread"/></svg></button>
        </div>
      </div>

      <div id="toasts" aria-live="polite"></div>
    </div>

    <!-- PAINEL DE DETALHES (barra lateral no desktop, gaveta no celular) -->
    <aside id="side" aria-label="Detalhes da variável">
      <div class="side-hdr">
        <h2>Detalhes</h2>
        <button type="button" class="tbtn icon" id="side-x" title="Fechar painel" aria-label="Fechar painel"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
      <div class="side-body" id="panel-content"></div>
    </aside>
  </div>
</div>

<!-- DIÁLOGO: NÓ (criar / editar) -->
<dialog id="dlg-node" aria-labelledby="dn-title">
  <form id="f-node" class="dlg-card" autocomplete="off" novalidate>
    <h2 id="dn-title">Novo nó</h2>
    <p class="dlg-sub" id="dn-sub">Crie uma nova variável no sistema.</p>
    <div class="field"><label for="nn-name">Nome</label>
      <input class="input" id="nn-name" placeholder="ex.: Taxa_Adocao" spellcheck="false">
      <p class="ferr" id="nn-err" hidden></p></div>
    <div class="row2">
      <div class="field"><label for="nn-cat">Categoria</label>
        <select class="input" id="nn-cat"></select></div>
      <div class="field"><label for="nn-val">Valor</label>
        <input class="input" id="nn-val" type="number" step="any" value="0"></div>
    </div>
    <div class="field"><label for="nn-eq">Equação <span class="opt">(opcional)</span></label>
      <textarea class="input mono" id="nn-eq" rows="2" placeholder="ex.: A * B + C" spellcheck="false"></textarea></div>
    <div class="field"><label for="nn-desc">Descrição</label>
      <textarea class="input" id="nn-desc" rows="2" placeholder="Qual é o papel desta variável?"></textarea></div>
    <div class="dlg-actions">
      <button type="button" class="btn" data-close>Cancelar</button>
      <button type="submit" class="btn primary" id="nn-ok">Criar nó</button>
    </div>
  </form>
</dialog>

<!-- DIÁLOGO: LIGAÇÃO -->
<dialog id="dlg-link" aria-labelledby="dl-title">
  <form id="f-link" class="dlg-card" autocomplete="off" novalidate>
    <h2 id="dl-title">Nova ligação</h2>
    <p class="dlg-sub">Defina como uma variável influencia a outra.</p>
    <div class="row2">
      <div class="field"><label for="lk-from">De</label><input class="input" id="lk-from" readonly></div>
      <div class="field"><label for="lk-to">Para</label><select class="input" id="lk-to"></select></div>
    </div>
    <div class="field"><label id="lk-sign-l">Efeito</label>
      <div class="seg" role="radiogroup" aria-labelledby="lk-sign-l">
        <label class="pos"><input type="radio" name="lk-sign" value="+" checked><span>+ Reforça <small>(A sobe → B sobe)</small></span></label>
        <label class="neg"><input type="radio" name="lk-sign" value="-"><span>− Reduz <small>(A sobe → B desce)</small></span></label>
      </div></div>
    <div class="field"><label for="lk-desc">Descrição <span class="opt">(opcional)</span></label>
      <textarea class="input" id="lk-desc" rows="2" placeholder="ex.: Preço maior reduz o volume vendido"></textarea>
      <p class="ferr" id="lk-err" hidden></p></div>
    <div class="dlg-actions">
      <button type="button" class="btn" data-close>Cancelar</button>
      <button type="submit" class="btn primary">Criar ligação</button>
    </div>
  </form>
</dialog>

<!-- DIÁLOGO: CONFIRMAÇÃO -->
<dialog id="dlg-confirm" aria-labelledby="dc-title">
  <form id="f-confirm" class="dlg-card" method="dialog">
    <h2 id="dc-title">Confirmar</h2>
    <p class="dlg-sub" id="dc-text"></p>
    <div class="dlg-actions">
      <button type="button" class="btn" data-close>Cancelar</button>
      <button type="submit" class="btn primary" id="dc-ok" value="ok">Confirmar</button>
    </div>
  </form>
</dialog>

<script>
__SCRIPT__
</script>
</body>
</html>
