<script>
/* Lê o tema real do Streamlit (claro/escuro, inclusive se o usuário o trocou no menu) e o grava em
   <html data-lumina-theme>. Roda num iframe invisível da mesma origem; o CSS da marca reage ao atributo. */
(function () {
  var doc;
  try { doc = window.parent.document; } catch (e) { return; }
  var root = doc.documentElement;
  function sync() {
    var app = doc.querySelector('.stApp');
    if (!app) return;
    // o tema da marca pinta .stApp só quando o atributo existe: tira-o um instante para ler a cor nativa
    var prev = root.getAttribute('data-lumina-theme');
    root.removeAttribute('data-lumina-theme');
    var m = (window.parent.getComputedStyle(app).backgroundColor || '').match(/[\d.]+/g);
    var next = prev || 'dark';
    if (m && m.length >= 3 && (m.length < 4 || parseFloat(m[3]) > 0.5)) {
      next = (0.299 * m[0] + 0.587 * m[1] + 0.114 * m[2]) < 140 ? 'dark' : 'light';
    }
    root.setAttribute('data-lumina-theme', next);
  }
  sync();
  setInterval(sync, 600);
})();
</script>
